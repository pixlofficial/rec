    <rect x="28.0" y="77.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="36.2" y="77.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="52.6" y="77.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="77.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="77.2" y="77.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="85.4" y="77.2" width="6.6" height="6.6" rx="1.0"/>

    <!-- Thruster Exhaust Blast (Row 8 - Cols 4, 5) -->
    <rect x="52.6" y="85.4" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="85.4" width="6.6" height="6.6" rx="1.0"/>
