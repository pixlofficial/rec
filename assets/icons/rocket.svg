<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- PixL REC - White Pixel Retro Rocket Icon -->
  <g fill="#FFFFFF" transform="scale(1.35)" transform-origin="60 60">
    <!-- Nose Tip (Row 1 - Cols 4, 5) -->
    <rect x="52.6" y="28.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="28.0" width="6.6" height="6.6" rx="1.0"/>

    <!-- Nose Cone (Row 2 - Cols 4, 5) -->
    <rect x="52.6" y="36.2" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="36.2" width="6.6" height="6.6" rx="1.0"/>

    <!-- Upper Fuselage (Row 3 - Cols 3..6) -->
    <rect x="44.4" y="44.4" width="6.6" height="6.6" rx="1.0"/>
    <rect x="52.6" y="44.4" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="44.4" width="6.6" height="6.6" rx="1.0"/>
    <rect x="69.0" y="44.4" width="6.6" height="6.6" rx="1.0"/>

    <!-- Mid Fuselage with Porthole Cutout (Row 4 - Cols 3, 6) -->
    <rect x="44.4" y="52.6" width="6.6" height="6.6" rx="1.0"/>
    <rect x="69.0" y="52.6" width="6.6" height="6.6" rx="1.0"/>

    <!-- Lower Fuselage (Row 5 - Cols 3..6) -->
    <rect x="44.4" y="60.8" width="6.6" height="6.6" rx="1.0"/>
    <rect x="52.6" y="60.8" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="60.8" width="6.6" height="6.6" rx="1.0"/>
    <rect x="69.0" y="60.8" width="6.6" height="6.6" rx="1.0"/>

    <!-- Fin Flare (Row 6 - Cols 2..7) -->
    <rect x="36.2" y="69.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="44.4" y="69.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="52.6" y="69.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="60.8" y="69.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="69.0" y="69.0" width="6.6" height="6.6" rx="1.0"/>
    <rect x="77.2" y="69.0" width="6.6" height="6.6" rx="1.0"/>

