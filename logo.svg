<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Obsidian Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1E1E2A" />
      <stop offset="55%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Outer Deep Scarlet Red Glow Filter -->
    <filter id="crimsonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pure Vibrant Blood-Red / Scarlet Gradient -->
    <linearGradient id="redDotGradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2A" />
      <stop offset="45%" stop-color="#E60000" />
      <stop offset="85%" stop-color="#B80000" />
      <stop offset="100%" stop-color="#730000" />
    </linearGradient>

    <!-- Warm Glass Specular Arc (Pure Red-White highlight, no magenta) -->
    <linearGradient id="specularGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#FF6666" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E60000" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Bevel Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C3C50" />
      <stop offset="50%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0E0E14" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="112" 
    fill="url(#bgGradient)" 
    stroke="url(#borderGradient)" 
    stroke-width="3" 
  />

  <!-- Concentric Aperture Ring 1 (Faint Outer Guide) -->
  <circle 
    cx="256" 
    cy="256" 
    r="182" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-opacity="0.03" 
    stroke-width="1.5" 
  />

  <!-- Concentric Aperture Ring 2 (Deep Red Orbit) -->
  <circle 
    cx="256" 
    cy="256" 
    r="142" 
    fill="none" 
    stroke="#FF0019" 
    stroke-opacity="0.15" 
    stroke-width="1.8" 
    stroke-dasharray="4 8" 
  />

  <!-- Wide Ambient Scarlet Glow Layer -->
  <circle 
    cx="256" 
    cy="256" 
    r="96" 
    fill="#E60000" 
    opacity="0.32" 
    filter="url(#crimsonGlow)" 
  />

  <!-- Core Soft Red Halo -->
  <circle 
    cx="256" 
    cy="256" 
    r="84" 
    fill="#FF0019" 
    opacity="0.45" 
    filter="url(#crimsonGlow)" 
  />

  <!-- Primary Pure Scarlet Red Record Core -->
  <circle 
    cx="256" 
    cy="256" 
    r="72" 
    fill="url(#redDotGradient)" 
    stroke="#FF2E3E" 
    stroke-width="2.2" 
    stroke-opacity="0.8" 
  />

  <!-- Top Specular Refraction Arc (Natural Lens Highlight) -->
  <ellipse 
    cx="256" 
    cy="224" 
    rx="38" 
    ry="18" 
    fill="url(#specularGlow)" 
  />
</svg>
