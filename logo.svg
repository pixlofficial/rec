<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Obsidian Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1C1C28" />
      <stop offset="60%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Outer Soft Crimson Glow Filter -->
    <filter id="crimsonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Core Red Gradient (Vibrant Studio Tally) -->
    <linearGradient id="redDotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="50%" stop-color="#FF2A54" />
      <stop offset="100%" stop-color="#D6002A" />
    </linearGradient>

    <!-- Subtle Inner Core Specular Highlight -->
    <linearGradient id="specularGlow" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF2A54" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Bevel Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A50" />
      <stop offset="50%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#0F0F16" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="110" 
    fill="url(#bgGradient)" 
    stroke="url(#borderGradient)" 
    stroke-width="3.5" 
  />

  <!-- Subtle Concentric Aperture Ring 1 (Faint Studio Lens Refraction) -->
  <circle 
    cx="256" 
    cy="256" 
    r="180" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-opacity="0.03" 
    stroke-width="1.5" 
  />

  <!-- Subtle Concentric Aperture Ring 2 (Glow Orbit) -->
  <circle 
    cx="256" 
    cy="256" 
    r="140" 
    fill="none" 
    stroke="#FF2A54" 
    stroke-opacity="0.12" 
    stroke-width="2" 
    stroke-dasharray="4 8" 
  />

  <!-- Outer Faint Red Glow Halo -->
  <circle 
    cx="256" 
    cy="256" 
    r="95" 
    fill="#FF2A54" 
    opacity="0.28" 
    filter="url(#crimsonGlow)" 
  />

  <!-- Secondary Tighter Glow Layer -->
  <circle 
    cx="256" 
    cy="256" 
    r="85" 
    fill="#FF2A54" 
    opacity="0.45" 
    filter="url(#crimsonGlow)" 
  />

  <!-- Primary Vivid Red Record Core -->
  <circle 
    cx="256" 
    cy="256" 
    r="72" 
    fill="url(#redDotGradient)" 
    stroke="#FF6B8B" 
    stroke-width="2.5" 
    stroke-opacity="0.7" 
  />

  <!-- Inner Top Specular Highlight Arc -->
  <ellipse 
    cx="256" 
    cy="222" 
    rx="42" 
    ry="22" 
    fill="url(#specularGlow)" 
  />
</svg>
