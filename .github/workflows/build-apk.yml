name: Build Android Binaries & Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build Target (aab / apk / both)"
        required: true
        default: "both"
        type: choice
        options:
          - aab
          - apk
          - both
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Google Play Android App Bundle (AAB)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || github.event.inputs.build_target == 'aab' || github.event.inputs.build_target == 'both' }}
        run: |
          VERSION=$(grep 'VERSION_NAME' version.properties | awk -F'=' '{print $2}' | tr -d '\r\n')
          echo "Building Google Play App Bundle (AAB) for version: $VERSION"
          ./gradlew bundleRelease --no-daemon --stacktrace
          mkdir -p build-output
          cp app/build/outputs/bundle/release/app-release.aab build-output/PixL-REC-v${VERSION}.aab
          cp app/build/outputs/bundle/release/app-release.aab build-output/PixL-REC.aab

      - name: Build Standalone Debug & Release APKs
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || github.event.inputs.build_target == 'apk' || github.event.inputs.build_target == 'both' }}
        run: |
          VERSION=$(grep 'VERSION_NAME' version.properties | awk -F'=' '{print $2}' | tr -d '\r\n')
          echo "Building APKs for version: $VERSION"
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          mkdir -p build-output
          
          # Standalone Release APK
          cp app/build/outputs/apk/release/app-release.apk build-output/PixL-REC-v${VERSION}.apk
          cp app/build/outputs/apk/release/app-release.apk build-output/PixL-REC.apk
          
          # Standalone Debug APK
          cp app/build/outputs/apk/debug/app-debug.apk build-output/PixL-REC-debug-v${VERSION}.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-output/PixL-REC-debug.apk

      - name: Generate Checksums & Build Manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' }}
        run: |
          cd build-output
          sha256sum *.{apk,aab} > SHA256SUMS.txt 2>/dev/null || sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Build Artifacts (AAB & APKs)
        uses: actions/upload-artifact@v4
        with:
          name: PixL-REC-Binaries
          path: build-output/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/*.aab
            build-output/*.apk
            build-output/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
